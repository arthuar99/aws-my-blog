name: Terraform Plan & Cost Check

on:
  pull_request:
    branches:
      - main
    paths:
      - '**.tf'
      - 'lambda/**'
      - '.github/workflows/terraform-plan.yml'

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.6.0

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Post Plan to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planFile = './tfplan';
            
            if (fs.existsSync(planFile)) {
              const plan = require('child_process')
                .execSync(`terraform show -no-color tfplan`, { encoding: 'utf-8' })
                .trim();
              
              const output = `## Terraform Plan
              
              \`\`\`
              ${plan.substring(0, 10000)}
              \`\`\`
              
              `;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output
              });
            }

      - name: Upload Plan
        uses: actions/upload-artifact@v3
        with:
          name: tfplan
          path: tfplan
          retention-days: 1

  cost-estimate:
    name: Cost Estimation
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Infracost
        uses: infracost/actions/setup@v2
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
        continue-on-error: true

      - name: Generate Cost Estimate
        run: |
          infracost breakdown --path . --format markdown > /tmp/infracost.md 2>/dev/null || echo "Infracost estimation skipped (API key not configured)"

      - name: Post Cost Estimate to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              if (fs.existsSync('/tmp/infracost.md')) {
                const costEstimate = fs.readFileSync('/tmp/infracost.md', 'utf-8');
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: costEstimate
                });
              }
            } catch (error) {
              console.log('Cost estimation not available');
            }
        continue-on-error: true
